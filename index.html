<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e7d32">
<title>Дача</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" crossorigin="anonymous">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><span id="title">🌱 Дача</span>
  <select id="year"></select>
  <span id="net" class="net"></span>
</header>
<main>
  <section id="v-map" class="view active"><div id="map"></div>
    <button id="btn-gps" class="fab" title="Посадить здесь (по GPS)">📍 Посадить здесь</button>
    <div id="hint" class="hint"></div>
  </section>
  <section id="v-list" class="view"></section>
  <section id="v-todo" class="view"></section>
  <section id="v-set" class="view"></section>
</main>
<nav>
  <button data-v="map" class="on">🗺️<span>Карта</span></button>
  <button data-v="list">📋<span>Посадки</span></button>
  <button data-v="todo">⏰<span>Пора</span></button>
  <button data-v="set">⚙️<span>Ещё</span></button>
</nav>
<div id="sheet" class="sheet hidden"><div class="sheet-body" id="sheet-body"></div></div>
<datalist id="crops"></datalist>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
